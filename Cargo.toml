[workspace]
members = ["rust/core", "rust/api", "rust/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cross-canon-core = { path = "rust/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = false
