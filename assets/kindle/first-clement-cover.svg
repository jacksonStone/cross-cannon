<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090704" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#090704" stop-opacity="0"/>
      <stop offset="1" stop-color="#090704" stop-opacity="0.97"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="2560" fill="#17100a"/>
  <image
    href="christ-pantocrator-sinai.jpg"
    width="1600"
    height="2560"
    preserveAspectRatio="xMidYMid slice"
  />
  <rect width="1600" height="2560" fill="url(#shade)"/>

  <g fill="#f4e8c8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="800" y="1925" font-size="52" letter-spacing="10">THE FIRST EPISTLE</text>
    <text x="800" y="2015" font-size="42" letter-spacing="8">OF</text>
    <text x="800" y="2120" font-size="82" letter-spacing="14">CLEMENT</text>
    <text x="800" y="2205" font-size="45" letter-spacing="6">TO THE CORINTHIANS</text>
    <line x1="430" y1="2270" x2="1170" y2="2270" stroke="#c9a55f" stroke-width="3"/>
    <text x="800" y="2370" font-size="42" font-style="italic">Clement of Rome</text>
  </g>
</svg>
