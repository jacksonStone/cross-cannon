<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<meta name="description" content="Read Scripture, Early Christian Works and Christian Classics with Cross Canon.">
<title>Cross Canon</title>
<link rel="icon" href="/favicon-c26c421629d8.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest-closed-book-v2.webmanifest">
<link rel="stylesheet" href="/browser/reader.css">
<link rel="preload" href="/browser/fonts/SourceSerif4-Semibold.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
<div id="loading" role="status"><span class="brand-mark">✣</span><h1>Cross Canon</h1><p>Opening your library…</p><progress aria-label="Loading library"></progress></div>
<canvas id="app-canvas" tabindex="-1" aria-label="Cross Canon dialogs"></canvas>
<main id="reader" hidden>
<header><button id="reader-jump" title="Jump to passage"></button><button class="icon library" id="reader-library" aria-label="Choose collection or work"></button><button class="icon tools" id="reader-tools" aria-label="Reader tools" aria-expanded="false"></button></header>
<div id="reader-scroll" tabindex="0" aria-label="Reading text"><article id="reader-text"></article></div>
<footer id="reader-footer" hidden><div id="reader-reference"></div><nav id="passage-actions" aria-label="Passage actions"></nav><p id="reader-status" role="status"></p></footer>
</main>
<div id="dialog-accessibility"></div>
<dialog id="tools-menu" aria-label="Reader tools"></dialog>
<dialog id="reader-settings" aria-labelledby="settings-title"><div class="sheet-header"><h2 id="settings-title">Reader settings</h2><button id="settings-done">Done</button></div><div id="settings-content"></div></dialog>
<script type="module" src="/browser/start.js"></script>
</body>
</html>
